name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install package and development tools
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Check formatting
        run: python -m ruff format --check neural_mesh tests examples
      - name: Lint
        run: python -m ruff check neural_mesh tests examples
      - name: Type check
        run: python -m mypy neural_mesh tests examples
      - name: Test
        run: python -m pytest
      - name: Run credential-free evaluation contracts
        run: |
          python -m neural_mesh evaluate examples/support_policy_replay.json --output support-report.json
          python -m neural_mesh evaluate examples/structured_policy_replay.json --output policy-report.json

  distribution:
    name: Distribution smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install build tools
        run: python -m pip install -r requirements-dev.txt
      - name: Build and validate metadata
        run: |
          python -m build
          python -m twine check dist/*
      - name: Inspect wheel contents
        run: python -m zipfile -l dist/neural_mesh-0.3.0-py3-none-any.whl
      - name: Install wheel outside the checkout
        run: |
          python -m venv "${RUNNER_TEMP}/neural-mesh-smoke"
          "${RUNNER_TEMP}/neural-mesh-smoke/bin/python" -m pip install --no-deps dist/neural_mesh-0.3.0-py3-none-any.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/neural-mesh-smoke/bin/python" -c "import neural_mesh; print(neural_mesh.__version__)"
          "${RUNNER_TEMP}/neural-mesh-smoke/bin/neural-mesh" --version
          "${RUNNER_TEMP}/neural-mesh-smoke/bin/python" -m neural_mesh --version
      - name: Run installed offline demo
        run: |
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/neural-mesh-smoke/bin/neural-mesh" demo
