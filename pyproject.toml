[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-mesh"
version = "0.2.0"
description = "Bounded, auditable consensus across application-supplied AI providers"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "LicenseRef-Helix-BSL-1.1"
license-files = ["LICENSE"]
authors = [
    { name = "Helix Collective", email = "collective@helix.ai" },
]
keywords = ["ai", "consensus", "llm", "multi-model", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build==1.2.2.post1",
    "mypy==1.14.1",
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.0.0",
    "ruff==0.9.10",
    "twine==6.1.0",
]

[project.urls]
Homepage = "https://github.com/Deathcharge/neural-mesh"
Repository = "https://github.com/Deathcharge/neural-mesh.git"
Issues = "https://github.com/Deathcharge/neural-mesh/issues"
Changelog = "https://github.com/Deathcharge/neural-mesh/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["neural_mesh*"]

[tool.setuptools.package-data]
neural_mesh = ["py.typed"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=neural_mesh",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["neural_mesh"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    '\.\.\.',
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
files = ["neural_mesh", "tests", "examples"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
